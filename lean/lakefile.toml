# One Lake project for the four Lean results that need Mathlib.
# The sources are NOT copied here: each library below reads the module files
# in place from the per-result folders under results/.
# The fourth result (degree-equality) needs no Mathlib and a different Lean
# version, so it stays a separate Lake project; see the README.
name = "QNumbersResults"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QNumbersResults", "Intertwining", "PellNegation", "JumpGap"]

# Same options as the per-result packages.
[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.29.1"

# Top module (lean/QNumbersResults.lean): imports every module below, so that a
# bare `lake build` compiles all of them, including Pell and Intertwine.
[[lean_lib]]
name = "QNumbersResults"

# results/intertwining: GosperCF.Intertwine
[[lean_lib]]
name = "Intertwining"
srcDir = "../results/intertwining/lean/GosperCF"
roots = ["GosperCF.Intertwine"]

# results/pell-negation: GosperCF.Negation, GosperCF.Pell.
# GosperCF.Pell imports GosperCF.Intertwine, which is built by the library above.
# The folder also holds a copy of Intertwine.lean; tools/audit_lean.py checks that
# it is byte-identical to the one that is built.
[[lean_lib]]
name = "PellNegation"
srcDir = "../results/pell-negation/lean/GosperCF"
roots = ["GosperCF.Negation", "GosperCF.Pell"]

# results/jump-gap: GosperCF.JumpGap, GosperCF.JumpGapDet
[[lean_lib]]
name = "JumpGap"
srcDir = "../results/jump-gap/lean/GosperCF"
roots = ["GosperCF.JumpGap", "GosperCF.JumpGapDet"]
